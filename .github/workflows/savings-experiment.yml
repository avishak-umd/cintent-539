# Measured-savings experiment for the TTS source-build bottleneck.
# The traces showed pip compiling NumPy from source inside the isolated build
# environment, because pyproject.toml pins numpy==1.22.0, which has no
# Python 3.11 wheel. Fixed: the build requirements from the maintainers' fix
# (coqui-ai/TTS 8bb2d65, PR #3001, "loosen dependencies to avoid building
# from source"). One run each, same pinned source, no instrumentation.
# Both variants run the workflow's own unit tests and print an environment
# fingerprint, to confirm the fix does not change what the workflow checks.

name: savings-experiment

on:
  workflow_dispatch:
  push:
    branches:
      - savings-experiment

jobs:
  test:
    name: ${{ matrix.variant }}-rep${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
        rep: [1]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc
          sudo apt-get install espeak espeak-ng
          make system-deps
      - name: Install/upgrade Python setup deps
        run: python3 -m pip install --upgrade pip setuptools wheel
      - name: Replace scarf urls
        run: |
          sed -i 's/https:\/\/coqui.gateway.scarf.sh\//https:\/\/github.com\/coqui-ai\/TTS\/releases\/download\//g' TTS/.models.json
      - name: Apply fix
        if: matrix.variant == 'fixed'
        run: |
          python3 - <<'PY'
          import re
          p = "pyproject.toml"
          s = open(p).read()
          old = 'requires = ["setuptools", "wheel", "cython==0.29.30", "numpy==1.22.0", "packaging"]'
          new = ('requires = [\n    "setuptools",\n    "wheel",\n    "cython~=0.29.30",\n'
                 '    "numpy>=1.22.0",\n    "packaging",\n]')
          assert old in s
          open(p, "w").write(s.replace(old, new))
          PY
          head -8 pyproject.toml
      - name: Install TTS
        run: |
          set -o pipefail
          python3 -m pip install .[all] 2>&1 \
            | while IFS= read -r line; do echo "$(date +%s) $line"; done \
            | tee /tmp/pip.log | cut -d' ' -f2-
          python3 setup.py egg_info
      - name: Build-dependency summary
        run: |
          grep -E "build dependencies|numpy-1\.22|Building wheel for numpy" /tmp/pip.log | head -20 || true
      - name: Verify install
        run: |
          cd /tmp && python3 -c "import TTS.tts.utils.monotonic_align.core, numpy; print('extension OK, numpy', numpy.__version__)"
      - name: Environment fingerprint
        run: |
          echo "packages: $(python3 -m pip freeze | wc -l)"
          echo "fingerprint: $(python3 -m pip freeze | grep -v '^TTS' | sort | sha256sum)"
      - name: Unit tests
        run: |
          nose2 -F -v -B TTS tests.zoo_tests.test_models.test_models_offset_0_step_3
          nose2 -F -v -B TTS tests.zoo_tests.test_models.test_voice_conversion
